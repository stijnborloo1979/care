name: tests

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --dir src
      - run: npx vitest run --config vitest.functions.config.ts
      - run: npm run build

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 met pgvector en pg_cron
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgvector postgresql-16-cron
      - name: Alle migraties en RLS-tests
        run: PG_BIN=/usr/lib/postgresql/16/bin supabase/tests/run_local.sh

name: ledbalk-apk

# Bouwt het hulpappje voor de ledbalk van een Philips-scherm. Het
# installatiebestand staat daarna bij de run, onder "Artifacts".
on:
  push:
    paths:
      - 'android/ledbalk/**'
      - '.github/workflows/ledbalk-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK bouwen
        working-directory: android/ledbalk
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LifeAngle-Ledbalk
          path: android/ledbalk/app/build/outputs/apk/debug/app-debug.apk
